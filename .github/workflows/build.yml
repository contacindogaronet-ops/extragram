name: Build Telegram Android Official

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-


      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0'

      - name: Inject Telegram API Credentials
        run: |
          touch local.properties
          echo "API_ID=${{ secrets.TELEGRAM_API_ID }}" >> local.properties
          echo "API_HASH=${{ secrets.TELEGRAM_API_HASH }}" >> local.properties
          echo "APP_CENTER_HASH=${{ secrets.APP_CENTER_HASH }}" >> local.properties

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK (AFAT)
        run: ./gradlew assembleAfatRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Official-Release-APKs
          path: 'TMessagesProj_App/build/outputs/apk/afat/release/app.apk'
