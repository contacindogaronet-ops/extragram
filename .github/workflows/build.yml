name: Build Telegram Android Official

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Inject Telegram API Credentials
        run: |
          touch local.properties
          echo "API_ID=${{ secrets.TELEGRAM_API_ID }}" >> local.properties
          echo "API_HASH=${{ secrets.TELEGRAM_API_HASH }}" >> local.properties
          echo "APP_CENTER_HASH=${{ secrets.APP_CENTER_HASH }}" >> local.properties

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK (AFAT)
        run: ./gradlew assembleAfatRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Official-AFAT-Release
          path: app/build/outputs/apk/afat/release/*.apk
