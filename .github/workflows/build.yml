name: Build Custom Telegram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache
          max-size: 2G

      - name: Generate API_KEYS File from Secrets
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          MAPS_V2_API: ${{ secrets.MAPS_V2_API }}
        run: |
          cat << EOT > API_KEYS
          APP_ID=${APP_ID}
          APP_HASH="${APP_HASH}"
          MAPS_V2_API="${MAPS_V2_API}"
          EOT

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle (ARM64 Only)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -Xss4m -XX:+UseG1GC'"
        run: ./gradlew :TMessagesProj:assembleAfatRelease -PabiList=arm64-v8a --no-configuration-cache --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exteraGram-Custom-APK
          path: TMessagesProj/build/outputs/apk/afat/release/*.apk
